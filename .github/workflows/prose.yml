name: Prose

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  prose:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # ai-tells identifies common AI-written prose patterns. The style package
      # is pinned in .vale.ini, and vale sync downloads it into the gitignored
      # styles directory.
      - name: Sync Vale styles
        # The Python Vale wrapper may fail transiently while downloading its binary; see
        # https://github.com/daniperez/vale-python-package/issues/77
        run: uvx vale@3.13.0.0 sync
      - name: Lint prose
        run: git ls-files '*.md' '*.rst' | xargs --no-run-if-empty uvx vale@3.13.0.0
